<!doctype html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:">
<title>Pip</title>
<link rel="stylesheet" href="island.css">
</head>
<body>
<div id="island" class="idle attach">
  <div id="shell">
    <div id="pill" role="button" tabindex="0" aria-label="Pip">
      <span id="pill-inner">
        <span id="pill-date"></span>
        <span id="pill-net"></span>
        <span class="pip" id="pip"><span class="hat"></span><span class="eye"></span><span class="eye"></span><span class="mouth"></span></span>
        <span id="pill-gap"></span>
        <span id="pill-text"></span>
        <span id="pill-ask" hidden><button type="button" class="pa-allow" data-pill-decide="allow"></button><button type="button" class="pa-deny" data-pill-decide="deny"></button></span>
        <span id="pill-chip"></span>
        <span id="pill-side"></span>
        <button id="pill-more" type="button"></button>
      </span>
    </div>
    <div id="recv" hidden><i id="recv-fill"></i></div>
    <div id="panel">
      <main id="page"></main>
      <nav id="bar">
        <button type="button" class="side" id="bar-bright"></button>
        <div id="tabs"></div>
        <button type="button" class="side" id="bar-vol"></button>
        <div id="tip"></div>
        <div id="bright-pop" hidden><span id="bright-ico"></span><input type="range" id="qbright" min="0" max="60"><span id="qbright-n"></span></div>
        <div id="vol-pop" hidden><span id="vol-ico"></span><input type="range" id="qvol" min="0" max="100"><span id="qvol-n"></span></div>
      </nav>
      <div id="menu" hidden></div>
    </div>
  </div>
</div>
<canvas id="confetti" hidden></canvas>
<script src="../shared/i18n.js"></script>
<script src="icons.js"></script>
<script src="island.js"></script>
</body>
</html>
