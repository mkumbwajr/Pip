name: build
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: python3 -m unittest server/test_license.py   # the license and EvPay flow, against a pretend EvPay
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Windows helper (media, volume, front window, Wi-Fi and Bluetooth)
        run: node tools/check-helper.js
      - name: NSIS (makensis for the installer)
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y --no-progress }
          Add-Content $env:GITHUB_PATH 'C:\Program Files (x86)\NSIS'
      - name: Installer
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with: { name: Pip-Setup, path: dist/*.exe }
  mac:
    runs-on: macos-latest
    permissions: { contents: write } # to put the disk image on the release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm test
      # the built-in Google sign-in client lives outside git; with this secret set, the Mac build has it too
      - name: Google client (optional)
        env: { GOOGLE_CLIENT_JSON: "${{ secrets.GOOGLE_CLIENT_JSON }}" }
        run: '[ -n "$GOOGLE_CLIENT_JSON" ] && printf "%s" "$GOOGLE_CLIENT_JSON" > src/main/google-client.json || echo "no GOOGLE_CLIENT_JSON secret: users bring their own Google client"'
      - name: DMG (Intel and Apple silicon, not signed)
        run: npm run dist:mac
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
      # the build's stamp next to the disk image: the website's latest.json takes it, so Macs see a rebuild as an update
      - run: cp src/build.json dist/Pip-mac-build.json
      - uses: actions/upload-artifact@v4
        with: { name: Pip-mac, path: dist/*.dmg }
      # on main: the disk image goes on the GitHub release for this version (public), where the website deploy picks it up
      - name: Version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Pip ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.dmg
            dist/Pip-mac-build.json
          fail_on_unmatched_files: true
