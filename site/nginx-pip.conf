# pip.bang.co.tz on the aaPanel Nginx (installed as /www/server/panel/vhost/nginx/pip.bang.co.tz.conf by
# tools/deploy-site.js). Same shape as the other sites on that server: HTTP only redirects (and answers Let's Encrypt),
# HTTPS serves the static files in /srv/pip. The certificate is renewed by certbot's timer with the webroot method.
server {
    listen 80;
    server_name pip.bang.co.tz;
    root /srv/pip;

    location ^~ /.well-known/acme-challenge/ {
        root /srv/pip-acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }

    access_log /www/wwwlogs/pip.bang.co.tz.log;
    error_log /www/wwwlogs/pip.bang.co.tz.error.log;
}

server {
    listen 443 ssl;
    server_name pip.bang.co.tz;
    root /srv/pip;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/pip.bang.co.tz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pip.bang.co.tz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    # inline styles are allowed so a self-contained page (e.g. privacy.html) can be uploaded as one file; scripts stay 'self' only
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'" always;

    # /privacy serves privacy.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    # Pip's Updates button and the download button read this: never cached
    location = /latest.json {
        add_header Cache-Control "no-cache" always;
        add_header Access-Control-Allow-Origin "*" always;
    }
    # pages, styles and scripts: browsers must check for a newer copy before using a cached one
    location ~* \.(?:html|css|js)$ {
        add_header Cache-Control "no-cache" always;
    }
    location ^~ /download/ {
        add_header Content-Disposition "attachment" always;
        add_header Cache-Control "public, max-age=300" always;
    }
    # Pip accounts (server/pip-api.py on 127.0.0.1:48620): the app only, never cached, small bodies
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:48620;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 20s;
        client_max_body_size 300k;
        add_header Cache-Control "no-store" always;
    }
    location ~ /\. {
        deny all;
    }

    access_log /www/wwwlogs/pip.bang.co.tz.log;
    error_log /www/wwwlogs/pip.bang.co.tz.error.log;
}
