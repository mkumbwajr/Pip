# peep.bang.co.tz: the app's address before it was renamed Pip. Every page, the installer links and the update check
# (latest.json) move permanently to pip.bang.co.tz. Let's Encrypt still renews this name's certificate through
# /srv/peep-acme, so old links keep working over HTTPS.
server {
    listen 80;
    server_name peep.bang.co.tz;

    location ^~ /.well-known/acme-challenge/ {
        root /srv/peep-acme;
    }

    location / {
        return 301 https://pip.bang.co.tz$request_uri;
    }

    access_log /www/wwwlogs/peep.bang.co.tz.log;
    error_log /www/wwwlogs/peep.bang.co.tz.error.log;
}

server {
    listen 443 ssl;
    server_name peep.bang.co.tz;

    ssl_certificate /etc/letsencrypt/live/peep.bang.co.tz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/peep.bang.co.tz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # the old installer names lead to the new installer
    location ^~ /download/ {
        return 301 https://pip.bang.co.tz/download/Pip-Setup.exe;
    }
    location / {
        return 301 https://pip.bang.co.tz$request_uri;
    }

    access_log /www/wwwlogs/peep.bang.co.tz.log;
    error_log /www/wwwlogs/peep.bang.co.tz.error.log;
}
